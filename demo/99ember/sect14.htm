      <h3>14</h3>
      <p>Something under the portcullis is watching you. You feel it as a cold finger on the back of the neck, and you step wide of the road before it can decide to move.</p>
      <p class="choice">You slip away into the reeds. <a href="sect38.htm">Turn to 38</a>.</p>
