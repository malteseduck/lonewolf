      <h3>61</h3>
      <p>A dry hummock rises out of the mud. Someone camped here and left in a hurry: a belt knife is wedged in the ground beside a stoppered flask of the green draught the marsh-wives brew.</p>
      <p>You may take them both.</p>
      <p class="choice">When you are ready, <a href="sect52.htm">turn to 52</a>.</p>
