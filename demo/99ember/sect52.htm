      <h3>52</h3>
      <p>A narrow door in the wall stands ajar, lamplight leaking round it. The warden of Thornwick will see only a courier who can prove the errand.</p>
      <p class="choice">If you carry the sealed letter, <a href="sect90.htm">turn to 90</a>.</p>
      <p class="choice">If you do not, you must go back and search the reeds again. <a href="sect38.htm">Turn to 38</a>.</p>
