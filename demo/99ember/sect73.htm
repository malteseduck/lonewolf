      <h3>73</h3>
      <p>The ground gives way and you go in to the waist. The cold drives the breath from you before you drag yourself out by a root, shivering and lighter by 3 <span class="smallcaps">ENDURANCE</span> points.</p>
      <p class="choice">Gasping, you follow the wall round to the narrow door. <a href="sect52.htm">turn to 52</a>.</p>
