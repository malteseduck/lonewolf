<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illustrations</title>
<link rel="stylesheet" href="admin.css">
<script type="module" src="parchment.js"></script>
<style>
  .sheet-top { display: flex; gap: 12px; align-items: center; padding: 16px 24px 8px; flex-wrap: wrap; }
  .sheet-top .sum { color: var(--dim); }
  .note { margin: 0 24px 6px; color: var(--dim); font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; padding: 8px 24px 32px; }
  /* the book's own tan, as on the picture sheet, so a picture looks as it does on the page */
  .card { background: linear-gradient(#e2d3aa, #cfbb89); color: var(--ink); border: 0; border-radius: 3px; padding: 8px; box-shadow: 0 2px 8px rgba(40, 24, 10, .45);
    position: relative; cursor: pointer; text-align: left; font: inherit; outline: 2px solid transparent; }
  .card:hover, .card:focus-visible { outline-color: var(--bronze); color: var(--ink); }
  .card .pic { height: 190px; display: grid; place-items: center; }
  .card img { max-width: 100%; max-height: 190px; mix-blend-mode: multiply; }
  .card b { display: block; font: 15px var(--title); margin-top: 6px; }
  .card small { display: block; color: #6b553c; font-size: 12px; }
  .card small.about { color: #3b2a18; font-size: 13px; font-style: italic; margin-top: 3px; white-space: normal; }
  .card small.about.unsaid { color: #a0522d; }
  .card .badge { position: absolute; top: 6px; right: 6px; font: 12px var(--title); color: #f3e6c4; background: #7d1d14; border-radius: 3px; padding: 2px 7px; }
  body.embed { padding: 0; }
  body.embed::before, body.embed::after { display: none; }

  /* before and after, side by side at one size; at 1:1 the two scroll together */
  #cmp { max-width: 98vw; width: 98vw; }
  #cmp .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #cmp .bar h2 { margin: 0 auto 0 0; }
  #cmp .sides { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 10px; }
  #cmp figure { margin: 0; }
  #cmp figcaption { font: 14px var(--title); color: var(--rubric); margin-bottom: 4px; }
  #cmp figcaption small { font: 12px system-ui, sans-serif; color: var(--dim); margin-left: 6px; }
  #cmp .pane { height: 74vh; overflow: hidden; background: linear-gradient(#e2d3aa, #cfbb89); border-radius: 3px; }
  /* fitted: both fill the pane at one scale, whatever their own sizes */
  #cmp .pane img { display: block; width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
  #cmp.zoom .pane { overflow: auto; }
  #cmp.zoom .pane img { height: auto; object-fit: initial; display: block; }
  #cmp .none { width: fit-content; margin: 30vh auto 0; font: 15px var(--title); color: #7d1d14; padding: 20px; border: 1px dashed #7d1d14; }
</style>
</head>
<body>
<header class="sheet-top"><span class="sum" id="sum">Reading the illustrations...</span></header>
<p class="note">Every illustration of the book, upscaled where step 9 has made its 2x WebP. Click one to see the original and the
  upscale side by side; "1:1" shows them at the upscale's own pixels, scrolling together. Left and right arrows go to the
  next one.</p>
<main class="cards" id="cards"></main>

<dialog id="cmp">
  <div class="bar">
    <h2 id="cmp-title"></h2>
    <label><input type="checkbox" id="cmp-zoom"> 1:1</label>
    <button id="cmp-prev" aria-label="Previous">&larr;</button>
    <button id="cmp-next" aria-label="Next">&rarr;</button>
    <button id="cmp-close">Close</button>
  </div>
  <div class="sides">
    <figure><figcaption>Original <small id="cmp-a-size"></small></figcaption><div class="pane" id="cmp-a"></div></figure>
    <figure><figcaption>Upscaled 2x <small id="cmp-b-size"></small></figcaption><div class="pane" id="cmp-b"></div></figure>
  </div>
</dialog>

<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const params = new URLSearchParams(location.search);
const code = params.get('book') || '';
// like the picture sheet, it opens only inside the dashboard (ADR 0021)
if (!(params.get('embed') === '1' && window.parent !== window)) {
  document.body.innerHTML = '<p style="padding:24px">This page opens only inside the import dashboard, <a href="/tools/admin/">/tools/admin/</a>.</p>';
  throw new Error('not embedded');
}
document.body.classList.add('embed');
const dir = `/data/projectaon/${encodeURIComponent(code)}/`, stamp = Date.now();
const src = (name) => `${dir}${encodeURIComponent(name)}?t=${stamp}`;  // fresh after a re-run of the upscale
const kb = (n) => (n == null ? '' : n < 1024 * 1024 ? `${Math.round(n / 1024)} KB` : `${(n / 1048576).toFixed(1)} MB`);
let ills = [], at = -1;

async function load() {
  const r = await fetch(`/api/admin/ills?book=${encodeURIComponent(code)}`, { cache: 'no-store' }).catch(() => null);
  const j = r && await r.json().catch(() => null);
  if (!r || !r.ok || !Array.isArray(j)) { $('#sum').textContent = (j && j.error) || 'The server did not answer.'; return; }
  ills = j;
  // what each picture is (tools/ill_index.py: `about`, kept in data/projectaon/ill-about.json)
  const x = await fetch('/data/projectaon/ill-index.json', { cache: 'no-store' }).catch(() => null);
  const index = x && x.ok ? ((await x.json().catch(() => null)) || {}) : {};
  for (const i of ills) i.about = index[`${code}/${i.name}`]?.about || '';
  const made = ills.filter((i) => i.big);
  const sum = (k, list) => list.reduce((t, i) => t + (i[k] || 0), 0);
  $('#sum').textContent = !ills.length ? 'This book has no illustrations.'
    : `${ills.length} illustrations, ${made.length} upscaled` + (made.length ? ` (${kb(sum('bytes', made))} of originals, ${kb(sum('bigBytes', made))} upscaled)` : '');
  $('#cards').innerHTML = ills.map((i, n) => `<button type="button" class="card" data-n="${n}">
      ${i.big ? '' : '<span class="badge">not upscaled</span>'}
      <div class="pic"><img src="${src(i.big || i.name)}" alt="" loading="lazy"></div>
      <b>${esc(i.name.replace('.png', ''))}</b>
      <small>${i.sections.length ? `section${i.sections.length > 1 ? 's' : ''} ${esc(i.sections.join(', '))}` : 'in no section'}</small>
      <small class="about${i.about ? '' : ' unsaid'}">${esc(i.about || 'not yet said what this picture is')}</small></button>`).join('');
}

function show(n) {
  at = (n + ills.length) % ills.length;
  const i = ills[at];
  $('#cmp-title').textContent = `${i.name.replace('.png', '')}${i.sections.length ? ', section ' + i.sections.join(', ') : ''}${i.about ? ': ' + i.about : ''}`;
  $('#cmp-a').innerHTML = `<img id="cmp-a-img" src="${src(i.name)}" alt="">`;
  $('#cmp-b').innerHTML = i.big ? `<img id="cmp-b-img" src="${src(i.big)}" alt="">` : '<div class="none">Not upscaled yet (step 9)</div>';
  $('#cmp-a-size').textContent = kb(i.bytes);
  $('#cmp-b-size').textContent = kb(i.bigBytes);
  const a = $('#cmp-a-img'), b = $('#cmp-b-img');
  a.onload = () => { $('#cmp-a-size').textContent = `${a.naturalWidth}x${a.naturalHeight}, ${kb(i.bytes)}`; fit(); };
  if (b) b.onload = () => { $('#cmp-b-size').textContent = `${b.naturalWidth}x${b.naturalHeight}, ${kb(i.bigBytes)}`; fit(); };
  if (!$('#cmp').open) $('#cmp').showModal();
}
/* At 1:1 both are drawn at the upscale's own size, the original stretched by the browser as the player would. */
function fit() {
  const a = $('#cmp-a-img'), b = $('#cmp-b-img'), zoom = $('#cmp-zoom').checked;
  $('#cmp').classList.toggle('zoom', zoom);
  const w = zoom && a ? (b?.naturalWidth || a.naturalWidth * 2) : null;
  for (const im of [a, b]) if (im) im.style.width = w ? `${w}px` : '';
}

$('#cards').addEventListener('click', (e) => { const c = e.target.closest('.card'); if (c) show(+c.dataset.n); });
$('#cmp-zoom').onchange = fit;
$('#cmp-prev').onclick = () => show(at - 1);
$('#cmp-next').onclick = () => show(at + 1);
$('#cmp-close').onclick = () => $('#cmp').close();$('#cmp').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') { e.preventDefault(); show(at - 1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); show(at + 1); }
});
// the two panes scroll together at 1:1
for (const [from, to] of [['#cmp-a', '#cmp-b'], ['#cmp-b', '#cmp-a']]) {
  $(from).addEventListener('scroll', () => {
    const f = $(from), t = $(to);
    if (t.scrollTop !== f.scrollTop || t.scrollLeft !== f.scrollLeft) { t.scrollTop = f.scrollTop; t.scrollLeft = f.scrollLeft; }
  });
}
load();
</script>
</body>
</html>
