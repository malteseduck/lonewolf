<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All maps</title>
<link rel="stylesheet" href="admin.css">
<script type="module" src="parchment.js"></script>
<style>
  body.embed { padding: 0; }
  body.embed::before, body.embed::after { display: none; }
  .sheet-top { display: flex; gap: 12px; align-items: center; padding: 16px 24px 8px; flex-wrap: wrap; }
  .sheet-top .sum { color: var(--dim); }
  .note { margin: 0 24px 6px; color: var(--dim); font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; padding: 8px 24px 32px; }
  /* the book's own tan, as on the other sheets */
  .card { background: linear-gradient(var(--tan-hi), var(--tan-lo)); color: var(--ink); border: 0; border-radius: 3px; padding: 8px;
    box-shadow: 0 2px 8px rgba(40, 24, 10, .45); position: relative; cursor: pointer; text-align: left; font: inherit;
    outline: 2px solid transparent; display: flex; flex-direction: column; white-space: normal; }
  .card:hover, .card:focus-visible { outline-color: var(--blood); color: var(--ink); }
  .card .pic { height: 210px; display: grid; place-items: center; overflow: hidden; }
  .card img { max-width: 100%; max-height: 210px; mix-blend-mode: multiply; }
  .card .none { font-size: 12px; color: var(--ink-dim); border: 1px dashed var(--ink-faint); padding: 18px 10px; }
  .card b { display: block; font: 16px/1.2 var(--title); margin-top: 6px; }
  .card .stage { position: absolute; top: 6px; right: 6px; font: 12px var(--title); color: var(--tan-hi); background: var(--bronze); border-radius: 3px; padding: 2px 7px; }
  .card .stage.done { background: var(--better); }
  .card dl { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; margin: 5px 0 0; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .card dt { color: var(--ink-dim); }
  .card dd { margin: 0; }
  .card dd.todo { color: var(--ink-faint); }
</style>
</head>
<body>
<header class="sheet-top"><span class="sum" id="sum">Reading the maps...</span></header>
<p class="note">Every downloaded book's map, as the player shows it once finished (else the nearest picture to it). Click one to
  open it in the map editor.</p>
<main class="cards" id="cards"></main>

<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
// like the other sheets, it opens only inside the dashboard (ADR 0021)
if (!(new URLSearchParams(location.search).get('embed') === '1' && window.parent !== window)) {
  document.body.innerHTML = '<p style="padding:24px">This page opens only inside the import dashboard, <a href="/tools/admin/">/tools/admin/</a>.</p>';
  throw new Error('not embedded');
}
document.body.classList.add('embed');

// map_books()'s stages, in the editor's order
const STAGE = { 'not started': 'Not started', started: 'Upscaled', labels: 'Labels drafted', lettered: 'Lettered',
  gemini: 'Gemini rounds', done: 'Finished' };
const day = (s) => (s ? String(s).replace(/^(\d{4})(\d\d)(\d\d)-.*/, '$1-$2-$3').slice(0, 10) : '');
const row = (k, v, todo) => `<dt>${k}</dt><dd${todo ? ' class="todo"' : ''}>${esc(v)}</dd>`;

async function load() {
  const r = await fetch('/api/map/index', { cache: 'no-store' }).catch(() => null);
  const j = r && await r.json().catch(() => null);
  if (!r || !r.ok || !Array.isArray(j)) { $('#sum').textContent = (j && j.error) || 'The server did not answer.'; return; }
  const maps = j.filter((m) => m.stage !== 'no map').sort((a, b) => (a.number ?? 999) - (b.number ?? 999));
  const none = j.filter((m) => m.stage === 'no map');
  const stamp = Date.now();
  $('#sum').textContent = `${maps.length} maps, ${maps.filter((m) => m.stage === 'done').length} finished`
    + (none.length ? `; no printed map in ${none.map((m) => m.number ?? m.code).join(', ')}` : '');
  $('#cards').innerHTML = maps.map((m) => `<button type="button" class="card" data-code="${esc(m.code)}" title="Open in the map editor">
      <span class="stage${m.stage === 'done' ? ' done' : ''}">${esc(STAGE[m.stage] || m.stage)}</span>
      <div class="pic">${m.thumb ? `<img src="${esc(m.thumb)}?t=${stamp}" alt="" loading="lazy">` : '<span class="none">No picture yet</span>'}</div>
      <b>${esc(m.number ?? '')}. ${esc(m.title || m.code)}</b>
      <dl>
        ${row('Labels', m.labels == null ? 'none yet' : m.labels, m.labels == null)}
        ${row('Checked', m.checked ? day(m.checked) : 'not yet', !m.checked)}
        ${row('Font', m.font ? m.font.replace(/\.(ttf|otf)$/i, '').replace(/-Regular$/, '') : 'not chosen', !m.font)}
        ${row('Rounds', m.rounds.length ? `${m.rounds.length} (last ${m.rounds.at(-1)})` : 'none', !m.rounds.length)}
        ${row('Finished', m.finish ? `round ${m.finish.round}, ${day(m.finish.made)}` : 'not yet', !m.finish)}
      </dl></button>`).join('');
}

// the dashboard opens the editor in the book's Map step (admin.js)
$('#cards').addEventListener('click', (e) => {
  const c = e.target.closest('.card');
  if (c) window.parent.postMessage({ mapIndex: 'open', book: c.dataset.code }, location.origin);
});
load();
</script>
</body>
</html>
