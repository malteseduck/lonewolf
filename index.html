<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<style>
/* Layout, after Lone Wolf HD: an open book of two matching framed pages. The story is written on the
   left; the right holds a panel (Kai Disciplines, inventory, or the fight). Round bronze medallions are the
   controls. The map is a separate sheet laid over the table. Everything in the book is sized in em off --bw. */
:root {
  color-scheme: dark;
  --void: #0a0706; --hide: #231510;
  --page: #dccb9f; --ink: #33231a; --ink-dim: #6b553c; --ink-faint: rgba(51, 35, 26, 0.3); --blood: #7d1d14;
  --bronze: #a08a58; --bronze-hi: #e2d09a; --bronze-lo: #3b3020; --bone: #e9e0c8; --kai: #7fe9f2;
  /* the HD character sheet's medallions: dark enamel in a ring of worn, beaded pewter; ivory glyphs that glow ember when learned */
  --enamel: #2f211a; --enamel-lo: #140c08; --pewter: #8a7b64; --pewter-lo: #4a3f31; --glyph: #f6eedc; --ember: #f0a040; --glyph-off: rgba(233, 224, 200, 0.2);
  --silver-hi: #fbf8f0; --silver: #cdc6b6; --silver-lo: #7d766a;
  --script: 'Charm', 'Apple Chancery', 'Segoe Script', cursive;
  --cap: 'Almendra Display', 'Old English Text MT', Georgia, serif;
  --title: 'Metamorphous', 'Palatino Linotype', Georgia, serif;
  --bw: min(97vw, 97vh * 1.4, 1800px);
  --o-bg: #17100b; --o-fg: #e0d4b6; --o-dim: #9a8c70; --o-line: #4a3a26; --o-accent: #8e7a48; --o-accent-fg: #140d08;
  --o-display: var(--title); --o-body: var(--script);
}
html, body { height: 100%; margin: 0; }
body { background: var(--void) var(--wood, none) center / 820px; color: var(--bone); font-family: var(--script); overflow: hidden; }
.glow { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 34% 80% at 0% 45%, rgba(255, 200, 80, 0.62), rgba(230, 150, 40, 0.2) 45%, transparent 75%), radial-gradient(ellipse 80% 80% at 45% 50%, transparent 50%, rgba(5, 3, 3, 0.85) 100%); z-index: 2; mix-blend-mode: screen; }
.shade { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 85% 85% at 40% 50%, transparent 55%, rgba(5, 3, 3, 0.9) 100%); z-index: 2; }
.gear { position: fixed; right: -52vh; top: 50%; width: 104vh; height: 104vh; margin-top: -52vh; transition: transform 1.2s cubic-bezier(0.3, 0, 0.2, 1); filter: drop-shadow(0 0 40px #000) brightness(0.5) saturate(0.8); }
.stage { position: relative; height: 100%; display: grid; place-items: center; padding: 0; }

.top { position: fixed; z-index: 6; right: calc(18px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; gap: 20px; font: 400 0.72rem var(--title); letter-spacing: 0.14em; text-transform: uppercase; }
.top a, .top button { color: #a89878; background: none; border: 0; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; text-decoration: none; text-shadow: 0 1px 3px #000; }
.top a:hover, .top button:hover { color: #fff; }
.top #offline { color: var(--o-dim); cursor: default; }
.top #offline.act { color: var(--ember); cursor: pointer; }
.top #offline.act:hover { color: #fff; }

/* ---------- the book ---------- */
.book { position: relative; width: var(--bw); aspect-ratio: 1.4; font-size: calc(var(--bw) / 59); transition: opacity 0.45s; z-index: 1; }
.spread { position: relative; height: 100%; display: grid; grid-template-columns: 1em 1fr 1fr 1em; perspective: 3200px; filter: drop-shadow(0 1.2em 1.4em rgba(0, 0, 0, 0.7)); }
/* the rest of the book: the edges of the pages beneath, stacked at each outer side */
.edges { margin: 0.3em 0; background: linear-gradient(90deg, rgba(14, 8, 4, 0.85), rgba(30, 18, 8, 0.35) 45%, rgba(30, 18, 8, 0.1)), repeating-linear-gradient(90deg, #c8b68a 0 0.09em, #5a4630 0.09em 0.14em, #b29f74 0.14em 0.24em, #4a3a26 0.24em 0.28em); box-shadow: inset 0 0.3em 0.35em rgba(0, 0, 0, 0.5), inset 0 -0.3em 0.35em rgba(0, 0, 0, 0.5), inset -0.12em 0 0.15em rgba(30, 18, 8, 0.6); }
.edges.l { border-radius: 0.5em 0 0 0.5em; }
.edges.r { border-radius: 0.5em 0 0 0.5em; transform: scaleX(-1); } /* the left stack mirrored, rounded corners and all */
.page { position: relative; min-width: 0; min-height: 0; color: var(--ink); background: var(--page) center / 100% 100% no-repeat; display: flex; flex-direction: column; }
.page.left { background-image: var(--parch-l); padding: 4em 4.1em 4em 4.3em; transform-origin: left center; }
.page.right { background-image: var(--parch-r); padding: 3.4em 3.6em 3.5em 3.5em; } /* closer to the frame than the story's margins: the panels need the room */
.page::before { content: ''; position: absolute; inset: 0.9em; background: var(--frame) center / 100% 100% no-repeat; pointer-events: none; }
.page.right::before { transform: scaleX(-1); }
/* each page darkens into the gutter, as paper curving down into the spine */
.page::after { content: ''; position: absolute; top: 0; bottom: 0; width: 3.2em; pointer-events: none; }
.page.left::after { right: 0; background: linear-gradient(90deg, transparent, rgba(60, 38, 18, 0.12) 55%, rgba(40, 24, 10, 0.42) calc(100% - 1px), rgba(40, 24, 10, 0.75) calc(100% - 1px)); } /* ending in the fold's fine line, so the copies a page turn makes carry it too */
.page.right::after { left: 0; background: linear-gradient(270deg, transparent, rgba(60, 38, 18, 0.12) 55%, rgba(40, 24, 10, 0.42)); }
.rightwrap { position: relative; display: flex; min-width: 0; min-height: 0; }
.rightwrap .page { flex: 1; }
.turning { position: absolute; left: 0; top: 0; z-index: 4; pointer-events: none; }
/* a page turn: the right leaf lifts at the spine and falls onto the left, the new story on its back */
.leaf { position: absolute; top: 0; z-index: 4; pointer-events: none; transform-origin: left center; transform-style: preserve-3d; }
.leaf > .page { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.leaf > .page.left { transform: rotateY(180deg); transform-origin: center; }
.leaf .dim { position: absolute; inset: 0; z-index: 9; background: linear-gradient(90deg, rgba(30, 18, 8, 0.5), rgba(30, 18, 8, 0.15)); opacity: 0; }

/* story page */
.badge { position: absolute; left: -0.6em; top: -0.6em; z-index: 3; }
.story { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0.6em; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5em; padding-right: 0.3em; scrollbar-width: thin; scrollbar-color: var(--ink-faint) transparent; }
.text { font-size: 1.24em; font-weight: 700; line-height: 1.32; }
.text p { margin: 0 0 0.35em; text-indent: 1.2em; }
.text p.first { text-indent: 0; }
.text p.first::first-letter { float: left; font: 400 3.1em/0.86 var(--title); padding: 0.04em 0.1em 0 0; color: var(--ink); }
.vignette.full { width: 56%; opacity: 0.9; -webkit-mask-image: radial-gradient(ellipse 74% 72% at 50% 50%, #000 76%, transparent 100%); mask-image: radial-gradient(ellipse 74% 72% at 50% 50%, #000 76%, transparent 100%); }
.vignette { display: block; width: 72%; margin: 0.1em auto; mix-blend-mode: multiply; }
/* the books' small pictures, cut to the drawing (trimSmall): one height, never wider than the column */
.vignette.small { width: auto; max-width: 100%; height: 7.5em; object-fit: contain; }
.vignette.small[data-trim] { visibility: hidden; }
.events { list-style: none; margin: 0; padding: 0; font-size: 1.15em; color: #31503a; }
.block { border-top: 1px solid var(--ink-faint); padding-top: 0.4em; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.1em 1.2em; font-size: 1.15em; }
.finds { align-items: center; gap: 0.45em 1.1em; }
.find { display: flex; align-items: center; gap: 0.45em; padding: 0; border: 0; background: none; color: var(--ink); font: inherit; font-weight: 700; text-align: left; line-height: 1.1; }
.find .med { --s: 2.2em; }
.find > span:last-child { display: flex; flex-direction: column; }
.find i { font-size: 0.72em; font-weight: 400; color: var(--ink-dim); }
.find:hover:not(:disabled) .med, .find:focus-visible .med { filter: brightness(1.25); }
.find:focus-visible { outline: none; }
.find:disabled:not(.got) { opacity: 0.45; }
.eyebrow { width: 100%; font: 400 0.62em var(--title); letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-dim); }
.eyebrow.lead { display: block; text-align: center; margin-bottom: 0.6em; } /* heads the introduction, clear of the badge */
.inkbtn { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; color: var(--ink); text-decoration: none; }
.inkbtn:hover:not(:disabled), .inkbtn:focus-visible { color: var(--blood); outline: none; }
.inkbtn:disabled { color: var(--ink-dim); text-decoration: none; font-weight: 400; }
.foeline { width: 100%; display: flex; justify-content: space-between; gap: 1em; font-weight: 700; }
.foeline i { font-weight: 400; color: var(--ink-dim); }
.choices { list-style: none; margin: 0; padding: 0.55em 0 0; border-top: 3px double var(--ink-faint); display: flex; flex-direction: column; gap: 0.25em; }
.choice { width: 100%; display: grid; grid-template-columns: 1.5em minmax(0, 1fr); align-items: start; border: 0; background: none; padding: 0.1em 0; text-align: left; font: 700 1em/1.25 var(--script); color: var(--ink); }
.choice::before { content: ''; width: 0.62em; height: 0.62em; margin-top: 0.32em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--bronze-hi), var(--bronze) 45%, var(--bronze-lo)); box-shadow: 0 0 0 0.1em var(--ink); }
.choice:hover:not(:disabled) span, .choice:focus-visible span { color: var(--blood); }
.choice:focus-visible { outline: none; }
.choice:disabled { color: var(--ink-dim); font-weight: 400; }
.choice:disabled::before { background: none; box-shadow: 0 0 0 0.08em var(--ink-faint); }
.choice em { font: 400 0.52em var(--title); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); margin-left: 0.6em; white-space: nowrap; }
/* a puzzle's answer: the reader writes the section number on the rule, as on paper */
.puzzle { display: flex; align-items: baseline; gap: 0.8em; padding-top: 0.45em; font: 700 1.2em/1.25 var(--script); color: var(--ink); }
.puzzle input { width: 3.2em; margin-left: 0.4em; padding: 0 0.1em; border: 0; border-bottom: 0.06em solid var(--ink); background: none; color: var(--ink); font: inherit; text-align: center; color-scheme: light; }
.puzzle input:focus { outline: none; border-bottom-color: var(--blood); }
.finis { text-align: center; border-top: 3px double var(--ink-faint); padding-top: 0.6em; display: flex; flex-direction: column; align-items: center; gap: 0.3em; }
.finis h2 { margin: 0; font: 400 2em/1.1 var(--cap); }
.finis.dead h2 { color: var(--blood); }
.finis p { margin: 0; font-size: 1.1em; color: var(--ink-dim); }
.finis .inkbtn { font-weight: 400; font-size: 1.05em; }
.seal { padding: 0.35em 1.5em; border: 1px solid var(--bronze-lo); background: linear-gradient(#8a7850, #4a3d26); color: var(--bone); font: 400 1em var(--title); letter-spacing: 0.08em; box-shadow: inset 0 0 0 0.12em rgba(226, 208, 154, 0.35), 0 0.2em 0.4em rgba(0, 0, 0, 0.4); clip-path: polygon(0.7em 0, calc(100% - 0.7em) 0, 100% 50%, calc(100% - 0.7em) 100%, 0.7em 100%, 0 50%); }
.seal:hover { filter: brightness(1.25); }
/* ---------- the title spread, after the HD title page ---------- */
.titlepage { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5em; text-align: center; }
.maker { font: 400 0.78em var(--title); letter-spacing: 0.3em; white-space: nowrap; text-transform: uppercase; color: var(--ink-dim); }
/* the mark: LONE and WOLF with the wolf's head between, as the HD logo has it */
.mark { margin: 0; display: flex; align-items: center; justify-content: center; gap: 0.16em; font: 400 2.8em/1 var(--title); letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink); text-shadow: 0 0.03em 0 rgba(255, 245, 220, 0.5), 0 0 0.02em var(--ink); }
.mark > span:not(.wolfmark)::first-letter { font-size: 1.3em; }
.wolfmark { width: 1.15em; height: 1.15em; display: block; filter: drop-shadow(0 0.02em 0 rgba(255, 245, 220, 0.4)); }
.wolfmark .glyph { width: 100%; height: 100%; }
.wolfmark .glyph i { background: linear-gradient(var(--ink-dim), var(--ink) 55%); }
.frontis { width: 100%; height: 11em; display: grid; place-items: center; margin: -0.3em 0 -0.6em; }
.frontis img { max-width: 100%; max-height: 100%; object-fit: contain; }
.motto { margin: 0; font: 700 1.3em/1.25 var(--script); color: var(--ink); }
.band { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 0.15em; }
.band em { font: 400 0.68em var(--title); font-style: normal; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink-dim); }
.band div { width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.35em; }
.scrollwork { flex: 1; min-width: 1.5em; height: 1.1em; fill: var(--ink); opacity: 0.85; }
.band div .scrollwork:last-child { transform: scaleX(-1); }
.med.numeral { --s: 2.25em; font: 400 0.82em/1 var(--title); color: rgba(233, 224, 200, 0.85); }
.med.numeral.lit { color: #fff3d6; text-shadow: 0 0 0.3em var(--ember), 0 0 0.6em rgba(240, 160, 64, 0.6); }
.med.numeral.off { opacity: 0.42; filter: grayscale(0.6); color: rgba(233, 224, 200, 0.5); }
/* the right page: each book a plaque in a bronze frame, its medallion standing out at the left, a rod running off towards the clockwork */
.shelfpage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0.6em; padding: 0.6em 0 0 1em; }
.kept { margin: 0; font-size: 1.05em; line-height: 1.25; color: var(--ink-dim); }
.plaqs { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; justify-content: safe center; gap: 1.6em; padding: 0.5em 0 0.5em 1.4em; margin-right: -1.8em; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: var(--ink-faint) transparent; }
.plaq { position: relative; flex: none; margin-right: 2.6em; display: flex; flex-direction: column; align-items: flex-start; gap: 0.15em; }
.plaq::after { content: ''; position: absolute; left: calc(100% - 0.3em); top: 1.55em; width: 3em; height: 0.42em; background: linear-gradient(var(--bronze-hi), var(--bronze) 45%, var(--bronze-lo)); box-shadow: 0 0 0 0.06em #140d08; }
.plaqmain { position: relative; z-index: 1; width: 100%; display: flex; align-items: center; gap: 0.8em; min-height: 3.4em; padding: 0.3em 1em 0.3em 0; border: 0.2em solid transparent; border-radius: 0.55em; color: var(--bone); font: inherit; text-align: left;
  background: radial-gradient(ellipse at 60% 30%, #4b3c30, #2a1f18 70%) padding-box, linear-gradient(135deg, var(--bronze-hi), var(--bronze) 30%, var(--bronze-lo) 55%, var(--bronze) 75%, var(--bronze-hi)) border-box;
  box-shadow: 0 0.25em 0.5em rgba(0, 0, 0, 0.45), inset 0 0 0 0.08em rgba(10, 6, 4, 0.8), inset 0 0 0 0.16em rgba(226, 208, 154, 0.18); }
.plaqmain:hover, .plaqmain:focus-visible { outline: none; box-shadow: 0 0 0.9em 0.2em rgba(255, 220, 140, 0.55), inset 0 0 0 0.08em rgba(10, 6, 4, 0.8), inset 0 0 0 0.16em rgba(226, 208, 154, 0.3); }
.plaqmain:hover .plaqtext b { color: #fff3d6; }
.plaqmain > .med { --s: 3.6em; margin: -0.4em 0 -0.4em -1.6em; }
.plaq.going .plaqmain > .med { box-shadow: 0 0 0 0.08em #140d08, 0 0 0.7em 0.1em rgba(240, 160, 64, 0.55); }
.roman { font: 400 1.05em/1 var(--title); color: #fff3d6; text-shadow: 0 0 0.3em var(--ember); }
.plaqtext { min-width: 0; display: flex; flex-direction: column; gap: 0.1em; }
.plaqtext b { font: 400 1.15em/1.15 var(--title); letter-spacing: 0.02em; }
.plaqtext i { font: 400 1em/1.1 var(--script); color: #b9ab8c; }
.plaqmore { display: flex; flex-wrap: wrap; gap: 0.2em 0.45em; padding-left: 2.4em; font-size: 0.95em; }
.plaqmore > * { white-space: nowrap; }
.plaqmore > .inkbtn + .inkbtn::before { content: '|'; margin-right: 0.45em; font-weight: 400; color: var(--ink-dim); }
.plaqmore:empty { display: none; }
.plaqmore > span { color: var(--ink-dim); }
.advname { width: 16em; padding: 0 0.1em; border: 0; border-bottom: 0.06em solid var(--ink); background: none; color: var(--ink); font: 700 1em var(--script); color-scheme: light; }
.advname:focus { outline: none; border-bottom-color: var(--blood); }
.advname::placeholder { color: var(--ink-dim); font-weight: 400; }
.restorefile { max-width: 16em; padding: 0 0.1em; border: 0; border-bottom: 0.06em solid var(--ink); background: none; color: var(--ink); font: 700 1em var(--script); color-scheme: light; }
.restorefile:focus { outline: none; border-bottom-color: var(--blood); }
.shelfpage h4.ruled .inkbtn { font: 400 0.75em var(--script); margin-left: 0.6em; }
.rounds { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.15em; font-size: 1.15em; color: var(--ink-dim); }
.rounds li:last-child { color: var(--ink); font-weight: 700; }

/* ---------- medallions ---------- */
.med { --s: 3.6em; position: relative; flex: none; width: var(--s); height: var(--s); padding: 0; border: 0; border-radius: 50%; color: var(--bone); font: inherit;
  background: radial-gradient(circle, #130d09 0 56%, transparent 57%), conic-gradient(from 20deg, var(--bronze-hi), var(--bronze) 12%, var(--bronze-lo) 30%, var(--bronze) 48%, var(--bronze-hi) 58%, var(--bronze-lo) 78%, var(--bronze) 92%, var(--bronze-hi));
  box-shadow: 0 0 0 0.08em #140d08, 0 0.22em 0.5em rgba(0, 0, 0, 0.6), inset 0 0 0 0.1em rgba(255, 240, 200, 0.18); display: grid; place-items: center; }
.med svg { width: 46%; height: 46%; fill: currentColor; }
.med.lit { color: var(--kai); }
.med.lit svg { filter: drop-shadow(0 0 0.25em var(--kai)); }
.med.empty { background: radial-gradient(circle, rgba(51, 35, 26, 0.14) 0 56%, transparent 57%), none; box-shadow: inset 0 0 0 0.1em var(--ink-faint); color: transparent; }
button.med:hover:not(:disabled), button.med:focus-visible, .med.sel { outline: none; box-shadow: 0 0 0 0.08em #140d08, 0 0 0.9em 0.18em rgba(255, 220, 140, 0.8), inset 0 0 0 0.1em rgba(255, 240, 200, 0.3); }
button.med:disabled { opacity: 0.4; }
.med .n { position: absolute; right: -0.25em; bottom: -0.25em; min-width: 1.5em; height: 1.5em; border-radius: 50%; background: #130d09; box-shadow: 0 0 0 0.1em var(--bronze); font: 400 0.7em/1.5em var(--title); text-align: center; color: var(--bone); }
.medcap { display: flex; flex-direction: column; align-items: center; gap: 0.2em; font: 400 0.62em var(--title); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); text-align: center; }
.medcap small { font: 400 1.15em var(--script); letter-spacing: 0; text-transform: none; color: var(--ink-dim); }

.rtabs { position: absolute; right: -0.9em; top: 0.6em; z-index: 5; display: flex; flex-direction: column; gap: 0.45em; }
/* the HD tab medallions: a heavy bronze bezel, banded and notched, round a black face with a silver glyph */
.rtabs .med.home { --s: 2.6em; margin: 0.5em 0 0 0.35em; } /* apart from the tabs: it leaves the book */
.rtabs .med { --s: 3.3em;
  background: radial-gradient(circle closest-side, #1d140f 0, #070403 74%, var(--bronze-lo) 75% 77%, transparent 78%),
    radial-gradient(circle closest-side, transparent 0 88%, rgba(20, 12, 6, 0.75) 89% 91%, transparent 92%),
    repeating-conic-gradient(from 3deg, transparent 0 7deg, rgba(30, 20, 8, 0.3) 7deg 9deg),
    conic-gradient(from 20deg, var(--bronze-hi), var(--bronze) 12%, var(--bronze-lo) 30%, var(--bronze) 48%, var(--bronze-hi) 58%, var(--bronze-lo) 78%, var(--bronze) 92%, var(--bronze-hi)); }
.med .glyph { width: 56%; height: 56%; filter: drop-shadow(0 0.05em 0.04em #000); }
.med .glyph i { background: linear-gradient(var(--silver-hi), var(--silver) 55%, var(--silver-lo)); }
.med .rose { width: 72%; height: 72%; filter: drop-shadow(0 0.05em 0.04em #000); }
.med.lit .glyph { filter: drop-shadow(0 0 0.08em var(--ember)) drop-shadow(0 0 0.3em rgba(240, 160, 64, 0.6)); }
.med.lit .glyph i { background: radial-gradient(circle at 50% 45%, var(--glyph) 45%, #f3d6a0 80%, var(--ember)); }
.rose .lt { fill: var(--silver-hi); }
.rose .dk { fill: var(--silver-lo); }
.rose .ring { fill: none; stroke: var(--silver); stroke-width: 2.4; }
.rtabs .med[aria-selected='true'] .glyph, .rtabs .med[aria-selected='true'] .rose { filter: drop-shadow(0 0 0.12em rgba(255, 225, 160, 0.9)) drop-shadow(0 0 0.3em rgba(240, 160, 64, 0.6)); }
/* the head of the right page: Combat Skill, Endurance, gold as small gauges, after the HD gold counter */
.gauges { flex: none; display: flex; align-items: center; gap: 0.5em; font-variant-numeric: lining-nums; }
.gauge { position: relative; display: flex; align-items: center; height: 1.75em; padding: 0 0.6em 0 0; margin-left: 0.9em; border: 0.14em solid transparent; border-radius: 0.3em; color: var(--glyph);
  background: radial-gradient(ellipse at 50% 30%, #3b2e25, #1a120d 75%) padding-box, linear-gradient(135deg, var(--bronze-hi), var(--bronze) 35%, var(--bronze-lo) 60%, var(--bronze-hi)) border-box;
  box-shadow: 0 0.15em 0.35em rgba(0, 0, 0, 0.45), inset 0 0 0 0.06em rgba(10, 6, 4, 0.9); }
.gauge > .med { --s: 2.1em; margin: 0 0.4em 0 -1.05em; }
.gauge > .med .glyph { width: 58%; height: 58%; }
.gauge b { font: 400 1.05em/1 var(--title); color: #fff3d6; }
.gauge small { font-size: 0.72em; color: #b9ab8c; }
.gauge .thread { position: absolute; left: 1.3em; right: 0.5em; bottom: 0.2em; height: 0.12em; background: rgba(0, 0, 0, 0.55); }
.gauge .thread i { display: block; height: 100%; background: #b13a2a; box-shadow: 0 0 0.2em rgba(200, 60, 40, 0.7); transition: width 0.5s; }
.gauge.gold .glyph i { background: linear-gradient(var(--bronze-hi), var(--bronze) 60%, var(--bronze-lo)); }
.gauge.ep b { margin-top: -0.25em; }
.gauge.ep .glyph i { background: linear-gradient(#f0b0a0, #b13a2a 60%, #6e1a10); }
.bar { height: 0.36em; background: rgba(0, 0, 0, 0.45); box-shadow: 0 0 0 1px rgba(226, 208, 154, 0.35); }
.bar i { display: block; height: 100%; background: #b13a2a; transition: width 0.5s; }
.panel { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0.8em; margin-top: 0.6em; padding-bottom: 1em; justify-content: space-evenly; } /* clear of the frame's foot */
.caption { min-height: 3.8em; padding: 0.5em 0.8em; border: 1px solid var(--ink-faint); background: rgba(51, 35, 26, 0.07); display: flex; align-items: center; gap: 0.8em; }
.caption div { flex: 1; min-width: 0; }
.caption h3 { margin: 0; font: 400 0.95em var(--title); letter-spacing: 0.06em; }
.caption p { margin: 0; font-size: 1.05em; line-height: 1.2; color: var(--ink-dim); }
/* a touched medallion's box, laid over the page beside it with a lozenge pointing back at it */
.tip { position: absolute; z-index: 6; width: 17em; min-height: 0; box-sizing: border-box; padding: 0.7em 0.9em; border: 1px solid var(--ink-dim); background: var(--page) var(--parch-r) center / cover; box-shadow: 0 0.4em 1.2em rgba(20, 12, 6, 0.45); flex-wrap: wrap; }
.tip::before { content: ''; position: absolute; left: var(--ax); width: 0.8em; height: 0.8em; margin-left: -0.4em; background: inherit; border: inherit; transform: rotate(45deg); }
.tip.down::before { top: -0.45em; border-right: 0; border-bottom: 0; }
.tip.up::before { bottom: -0.45em; border-left: 0; border-top: 0; }
.tip .seal { font-size: 0.9em; }
.kept { margin: 0; font-size: 0.95em; line-height: 1.2; color: var(--ink-dim); }

/* Kai panel, after the HD character sheet */
.likeness { position: relative; flex: none; height: 7.2em; margin: -0.6em 0 0; }
.likeness img { position: absolute; right: -0.6em; top: -0.4em; width: 100%; height: 8.6em; object-fit: contain; object-position: right top; pointer-events: none; }
.who { position: absolute; left: 0; bottom: 0; display: flex; align-items: center; gap: 0.4em; }
.who .disc { --s: 2.7em; }
.who h3 { margin: 0; padding: 0 1.4em 0 0.1em; font: 700 1.75em/1.1 var(--script); color: var(--ink); border-bottom: 1px solid var(--ink); text-shadow: 0 0 0.3em var(--page); }
.ledgers { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 1.4em; position: relative; font: 400 0.82em/1.5 var(--title); font-variant-numeric: lining-nums; }
.ledgers::before { content: ''; position: absolute; left: 50%; top: 1.6em; bottom: 0.2em; border-left: 1px solid var(--ink-faint); }
.ledgers::after { content: ''; position: absolute; left: 50%; top: 0.75em; width: 0.5em; height: 0.5em; margin-left: -0.25em; background: var(--ink); transform: rotate(45deg); }
h4.ruled { flex: none; margin: 0 0 0.15em; font: 400 1.08em/1.2 var(--title); color: var(--ink); text-align: right; }
.ledgers h4.ruled { font-size: 1.25em; }
h4.ruled small { font-size: 0.7em; color: var(--ink-dim); margin-left: 0.3em; }
.ledgers section > div ~ h4 { margin-top: 0.35em; }
.swash { display: flex; align-items: flex-end; height: 0.42em; margin-top: -0.05em; }
.swash svg { flex: none; width: 1.9em; height: 0.62em; fill: var(--ink); }
.swash i { flex: 1; height: 0.07em; margin-bottom: 0.25em; background: linear-gradient(90deg, var(--ink), var(--ink-dim)); }
.ledgers section > div { display: flex; justify-content: space-between; align-items: center; gap: 0.6em; padding: 0 0.15em; color: var(--ink); }
.ledgers section > div b { font-weight: 400; white-space: nowrap; }
.ledgers section:first-child > div:not(.long) > span { white-space: nowrap; } /* "Combat Skill" beside its steppers */
/* Magnakai ranks ("Kai Master Superior") and circle lists are long: they wrap, right-aligned */
.ledgers section > div.long { align-items: baseline; }
.ledgers section > div.long b { white-space: normal; text-align: right; line-height: 1.15; }
.ledgers .step { margin: 0 0.15em 0 0; }
.ledgers .step button { width: 1.35em; height: 1.35em; }
/* the grid of medallions, framed like the HD sheet's lower panel */
.discs { flex: none; position: relative; display: flex; flex-direction: column; justify-content: center; gap: 0.75em; padding: 1.15em 1.1em 1.3em; background: var(--grid-frame) center / 100% 100% no-repeat, rgba(51, 35, 26, 0.08); }
.drow { display: flex; align-items: center; }
.linkwrap { position: relative; flex: 1; min-width: 0.6em; height: 1em; margin: 0 -0.15em; z-index: 0; }
.linkwrap .link { position: absolute; inset: 0; width: 100%; height: 100%; }
.link .band { fill: var(--enamel); }
.link .edge { fill: none; stroke: var(--pewter); stroke-width: 1; }
.linkwrap .chev { position: absolute; left: 0.25em; top: 50%; width: 0.55em; height: 0.55em; margin-top: -0.275em; background: var(--pewter); clip-path: polygon(0 0, 45% 0, 100% 50%, 45% 100%, 0 100%, 55% 50%); }
.disc { --s: 3.1em; position: relative; z-index: 1; flex: none; width: var(--s); height: var(--s); padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; color: inherit; font: inherit;
  /* enamel; a dark groove; a slim beaded pewter ring with an engraved line near its rim */
  background: radial-gradient(circle closest-side, var(--enamel) 0, var(--enamel-lo) 76%, #0c0705 77% 79%, transparent 80%),
    radial-gradient(circle closest-side, transparent 0 89%, rgba(20, 12, 8, 0.7) 90% 92%, transparent 93%),
    radial-gradient(circle at 40% 25%, rgba(255, 245, 220, 0.35), transparent 60%),
    repeating-conic-gradient(var(--pewter) 0 5deg, var(--pewter-lo) 5deg 7.5deg, var(--pewter) 7.5deg 10deg),
    var(--pewter);
  box-shadow: 0 0 0 0.07em var(--enamel-lo), 0 0.15em 0.35em rgba(0, 0, 0, 0.45), inset 0 0.08em 0.1em rgba(255, 245, 220, 0.35); }
.disc::after { content: ''; position: absolute; left: 50%; bottom: -0.32em; width: 0.42em; height: 0.42em; margin-left: -0.21em; transform: rotate(45deg); background: var(--enamel); box-shadow: 0 0 0 0.08em var(--pewter), 0 0 0 0.13em var(--enamel-lo); }
.who .disc::after { display: none; }
.glyph { width: 56%; height: 56%; display: block; }
.glyph i { display: block; width: 100%; height: 100%; background: var(--glyph-off); -webkit-mask: var(--g) center / contain no-repeat; mask: var(--g) center / contain no-repeat; }
.disc.lit .glyph { filter: drop-shadow(0 0 0.06em var(--ember)) drop-shadow(0 0 0.22em rgba(240, 160, 64, 0.55)); }
.disc.lit .glyph i { background: radial-gradient(circle at 50% 45%, var(--glyph) 45%, #f3d6a0 80%, var(--ember)); }
button.disc:hover, button.disc:focus-visible, .disc.sel { outline: none; box-shadow: 0 0 0 0.07em var(--enamel-lo), 0 0 0.8em 0.15em rgba(255, 220, 140, 0.85), inset 0 0.08em 0.1em rgba(255, 245, 220, 0.35); }
button.disc:not(.lit):hover .glyph i, .disc.sel:not(.lit) .glyph i { background: rgba(233, 224, 200, 0.45); }

/* inventory */
/* inventory, after the HD equipment sheet */
.kit { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 0.1em; }
/* his figure, faint, as the warrior sketch behind the HD paper doll */
.kit img { position: absolute; left: 50%; top: 42%; height: 88%; width: auto; max-width: 100%; object-fit: contain; transform: translate(-50%, -50%); opacity: 0.42; pointer-events: none; }
.doll { position: relative; display: grid; grid-template-columns: repeat(3, auto); justify-content: center; align-items: center; gap: 0 0.9em; }
.doll > span { display: grid; place-items: center; }
.doll .sh .disc { --s: 2.7em; }
.doll .sh { align-self: end; }
.doll .head .disc { --s: 2.9em; }
.doll .wl .disc, .doll .wr .disc { --s: 3.5em; }
.doll .body .disc { --s: 4.2em; }
.doll .belt { grid-column: 2; display: flex; gap: 0.5em; }
.doll .belt .disc { --s: 2.5em; }
.doll .belt .disc::after, .doll .sh .disc::after { display: none; }
/* the HD sheet's scrolled rule, a curl at each end and a lozenge in the middle */
.flourish { flex: none; height: 1em; margin: 0.15em 0.6em; }
.flourish svg { display: block; width: 100%; height: 100%; overflow: visible; }
.flourish path { fill: none; stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.flourish path.gem { fill: var(--ink); }
.specials { position: relative; flex: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.35em 0.75em; }
.specials .disc { --s: 2.4em; }
.disc.item .glyph i { background: linear-gradient(var(--silver-hi), var(--silver) 55%, var(--silver-lo)); }
.disc.item.lit .glyph i { background: radial-gradient(circle at 50% 45%, var(--glyph) 45%, #f3d6a0 80%, var(--ember)); }
/* an empty slot: the ring alone, open to whatever lies under it */
.disc.empty { -webkit-mask: radial-gradient(circle closest-side, transparent 76%, #000 77%); mask: radial-gradient(circle closest-side, transparent 76%, #000 77%);
  background: radial-gradient(circle closest-side, transparent 0 76%, rgba(12, 7, 5, 0.6) 77% 79%, transparent 80%),
    radial-gradient(circle closest-side, transparent 0 89%, rgba(20, 12, 8, 0.6) 90% 92%, transparent 93%),
    repeating-conic-gradient(var(--pewter) 0 5deg, var(--pewter-lo) 5deg 7.5deg, var(--pewter) 7.5deg 10deg);
  opacity: 0.8; box-shadow: 0 0 0 0.07em rgba(20, 12, 8, 0.5); }
.disc.empty::after, .bag > .disc::after, .pack .disc::after, .specials .disc::after { display: none; }
.bag { flex: none; display: flex; align-items: center; justify-content: center; gap: 1.1em; }
.bag > .disc { --s: 3.4em; }
.pack { position: relative; flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--enamel); box-shadow: 0 0 0 0.16em var(--enamel-lo), 0 0.15em 0.4em rgba(0, 0, 0, 0.4); }
/* the ironwork over the tiles (packLattice): pewter lines and curls, the discs above them */
.pack .lattice { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.lattice .sq, .lattice .frame, .lattice .curl, .lattice .sweep { fill: none; stroke: var(--bronze); stroke-width: 1.3; vector-effect: non-scaling-stroke; }
.lattice .sq { stroke: rgba(138, 123, 100, 0.5); }
.lattice .frame { stroke-width: 1.4; }
.lattice .frame.in { stroke: var(--pewter-lo); }
.lattice .curl { stroke-width: 1.7; }
.lattice .sweep { stroke: var(--ink); stroke-width: 1.5; }
.lattice .stud { fill: var(--bronze); stroke: var(--enamel-lo); stroke-width: 0.8; vector-effect: non-scaling-stroke; }
.pack .cell > * { position: relative; z-index: 1; }
/* each tile: dark leather with an engraved inner line, as the HD Backpack grid */
.pack .cell { aspect-ratio: 1; display: grid; place-items: center; padding: 0.4em; background: radial-gradient(circle, #3b2b21, #22170f 75%); }
.pack .disc { --s: 2.8em; }
/* adding by hand: rows of small medallions where the worn kit was */
.page .picker { flex: 1; min-height: 0; max-height: none; margin-bottom: 0; display: flex; flex-direction: column; gap: 0.35em; } /* the doll's space exactly, scrolling within it, so the Backpack below stays put */
.picker h4.ruled .inkbtn { font: 400 0.75em var(--script); margin-left: 0.6em; }
.pickrow { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); align-items: center; gap: 0.5em; }
.pickrow em { font: 400 0.7em var(--title); letter-spacing: 0.08em; color: var(--ink-dim); font-style: normal; text-align: right; }
.pickrow div { display: flex; flex-wrap: wrap; gap: 0.3em; }
.pickrow .disc { --s: 2.25em; }
/* every label one width, wrapping when long ("Special Items"), so the icons line up in one column */
.page .pickrow em { flex: none; box-sizing: border-box; width: 7.4em; min-width: 0; padding-top: 1em; align-self: flex-start; line-height: 1.15; white-space: normal; }
.page .pickrow div { flex: 1; min-width: 0; }
.pickrow .disc::after { display: none; }
.disc.other::before { content: '+'; position: absolute; right: -0.15em; bottom: -0.15em; width: 1.05em; height: 1.05em; border-radius: 50%; background: var(--enamel-lo); box-shadow: 0 0 0 0.07em var(--pewter); color: var(--glyph); font: 400 0.75em/1.05em var(--title); text-align: center; }
.pickname { margin: 0.1em 0 0 5.7em; min-height: 1.3em; font-size: 1.05em; color: var(--ink-dim); }
input.pickname { width: calc(100% - 5.7em); padding: 0 0.1em; border: 0; border-bottom: 1px solid var(--ink); background: none; color: var(--ink); font: 700 1.05em var(--script); color-scheme: light; }
input.pickname:focus { outline: none; border-bottom-color: var(--blood); }
input.pickname::placeholder { color: var(--ink-dim); font-weight: 400; }
.purse { display: inline-flex; align-items: center; gap: 0.3em; font: 400 0.9em var(--title); white-space: nowrap; }
.purse b { font-weight: 400; font-size: 1.3em; font-variant-numeric: lining-nums; }
.purse .glyph { width: 1.4em; height: 1.4em; }
.purse .glyph i { background: linear-gradient(var(--bronze-hi), var(--bronze) 55%, var(--bronze-lo)); }

/* the fight */
.foebar { display: flex; align-items: center; gap: 0.8em; font: 400 1.05em var(--title); color: var(--blood); }
.foebar .bar { flex: 1; }
.foebar small { font-size: 0.7em; color: var(--ink-dim); white-space: nowrap; font-variant-numeric: lining-nums; }
.fight { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; }
.fight canvas { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: multiply; }
.fight .foebar { position: relative; isolation: isolate; padding: 0.15em 0.2em 1.4em; }
.fight .cmds { position: relative; isolation: isolate; padding-top: 3em; }
/* the shade that keeps the name and the controls legible over the plate, faded out at the sides too */
.fight .foebar::before, .fight .cmds::before { content: ''; position: absolute; inset: 0 -1em; z-index: -1; -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); }
.fight .foebar::before { background: linear-gradient(rgba(178, 154, 112, 0.95) 40%, rgba(178, 154, 112, 0)); }
.fight .cmds::before { background: linear-gradient(rgba(178, 154, 112, 0), rgba(176, 152, 110, 0.95) 48%); }
.cmds .medcap .med { --s: 5.4em; }
.cmds { display: flex; align-items: flex-end; justify-content: center; gap: 0.7em; }
/* The Random Number: a medallion like the others, its bronze bezel engraved 0-9. The bezel turns;
   the black face shuffles the digits and settles on the one under the notch at the top. */
.dial { position: relative; flex: none; width: 4.6em; height: 4.6em; border: 0; padding: 0; border-radius: 50%; color: #1c1208; font: inherit;
  background: radial-gradient(circle closest-side, transparent 0 88%, rgba(20, 12, 6, 0.7) 89% 91%, transparent 92%),
    conic-gradient(from 20deg, var(--bronze-hi), var(--bronze) 12%, var(--bronze-lo) 30%, var(--bronze) 48%, var(--bronze-hi) 58%, var(--bronze-lo) 78%, var(--bronze) 92%, var(--bronze-hi));
  box-shadow: 0 0 0 0.08em #140d08, 0 0.22em 0.5em rgba(0, 0, 0, 0.6), inset 0 0 0 0.1em rgba(255, 240, 200, 0.18); }
.dial-ring { position: absolute; inset: 0; border-radius: 50%; }
.dial-ring span { position: absolute; left: 50%; top: 50%; width: 1.4em; margin: -0.62em 0 0 -0.7em; text-align: center; font: 400 0.42em/1.24 var(--title); font-variant-numeric: lining-nums; text-shadow: 0 0.06em 0 rgba(255, 240, 200, 0.45); }
.dial-ring span.hit { color: #fff3d6; text-shadow: 0 0 0.3em var(--ember), 0 0 0.6em var(--ember); }
.dial-hub { position: absolute; inset: 19%; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #1d140f, #070403 75%); box-shadow: 0 0 0 0.07em var(--bronze-lo), inset 0 0.12em 0.3em rgba(0, 0, 0, 0.8); display: grid; place-items: center;
  color: var(--glyph); font: 400 1.35em/1 var(--title); font-variant-numeric: lining-nums; text-shadow: 0 0 0.15em var(--ember), 0 0 0.4em rgba(240, 160, 64, 0.6); }
.dial-hub.shuffle { color: rgba(233, 224, 200, 0.55); text-shadow: none; }
.dial-pin { position: absolute; left: 50%; top: -0.2em; width: 0.42em; height: 0.42em; margin-left: -0.21em; transform: rotate(45deg); background: linear-gradient(135deg, var(--bronze-hi), var(--bronze-lo)); box-shadow: 0 0 0 0.06em #140d08; }
.dial:hover, .dial:focus-visible { outline: none; box-shadow: 0 0 0 0.08em #140d08, 0 0 0.9em 0.18em rgba(255, 220, 140, 0.8), inset 0 0 0 0.1em rgba(255, 240, 200, 0.3); }
.dialslot { display: flex; align-items: center; justify-content: center; gap: 1em; }
.cmds .dial { align-self: flex-start; margin-top: -0.4em; } /* level with the command medallions, its foot beside their labels */
.dialslot p { margin: 0; font-size: 1.15em; color: var(--ink-dim); max-width: 10em; }
.book.hurt { animation: hurt 0.38s; }
.book.hurt .page { box-shadow: inset 0 0 5em rgba(150, 20, 10, 0.7); }
@keyframes hurt { 20% { transform: translate(-0.6em, 0.25em) rotate(-0.4deg); } 45% { transform: translate(0.5em, -0.3em) rotate(0.3deg); } 70% { transform: translate(-0.3em, -0.1em); } }

/* ---------- setting out: the Action Chart over both pages (setupLeftHTML) ---------- */
.setup { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0.6em; }
.setup .eyebrow.lead { margin-bottom: 0; }
.su-h { margin: 0; font: 400 2.3em/1.05 var(--cap); text-align: center; }
.su-note { margin: 0; font-size: 1.15em; line-height: 1.3; color: var(--ink-dim); text-align: center; text-wrap: balance; }
.su-val { --s: 2.45em; font: 400 1.35em/1 var(--title); color: #fff3d6; text-shadow: 0 0 0.3em var(--ember); } /* bronze, as the section number */
button.su-val { color: rgba(233, 224, 200, 0.85); text-shadow: none; }
.su-scores { display: flex; justify-content: center; gap: 3.5em; padding: 0.4em 0; }
.su-score { display: flex; flex-direction: column; align-items: center; gap: 0.25em; }
.su-score b, .su-gold b { font: 400 0.82em var(--title); letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; }
.su-score i { font-size: 1.15em; font-style: normal; color: var(--ink-dim); }
.su-score em, .su-gold em { font: 400 1.25em var(--title); font-style: normal; color: var(--ink); }
.su-gold { display: flex; align-items: center; justify-content: center; gap: 1.2em; }
.su-gold p { margin: 0.1em 0 0; font-size: 1.15em; line-height: 1.25; color: var(--ink-dim); }
.su-wear { font-weight: 400; color: var(--ink-dim); }
.su-foot { flex: none; margin-top: auto; }
.su-foot .seal { font-size: 1.1em; }
.su-foot .seal:disabled { filter: grayscale(0.7); opacity: 0.55; }
.su-foot span { display: flex; gap: 0.45em; }
.su-foot span .inkbtn { font-weight: 400; font-size: 1.05em; }
.su-foot span .inkbtn + .inkbtn::before { content: '|'; margin-right: 0.45em; color: var(--ink-dim); }
/* a slot for each choice, filling as they are made */
.su-slots > div { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6em 0.9em; padding: 1.1em 0.8em 1em; background: var(--grid-frame) center / 100% 100% no-repeat, rgba(51, 35, 26, 0.08); }
.su-slots .disc { --s: 2.8em; }
.su-slots .disc::after { display: none; }
/* the facing page: each choice a row, its medallion, name and what it does */
.supage { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; justify-content: safe center; gap: 0.4em; margin-top: 0.4em; padding: 0 0.3em 0.6em 0.4em; scrollbar-width: thin; scrollbar-color: var(--ink-faint) transparent; }
.sulist { flex: none; display: flex; flex-direction: column; gap: 0.3em; }
.sulist.short { flex-direction: row; flex-wrap: wrap; gap: 0.4em 1.2em; }
.suitem { display: flex; align-items: center; gap: 0.7em; padding: 0; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; }
.suitem .disc { --s: 2.5em; }
.suitem .disc::after { display: none; }
.suitem .glyph i { background: rgba(233, 224, 200, 0.5); }
.suitem > span:last-child { min-width: 0; display: flex; flex-direction: column; }
.suitem b { font: 400 0.85em/1.2 var(--title); }
.suitem b small { font: 400 1.05em var(--script); color: var(--ink-dim); }
.suitem i { font-size: 0.95em; font-style: normal; line-height: 1.15; color: var(--ink-dim); }
.suitem[aria-pressed='true'] b { color: var(--blood); }
