<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lone Wolf: By Candlelight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Cormorant+SC:wght@500;600&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<link rel="stylesheet" href="../../shared/shared.css">
<style>
/* Layout: one full-window 3D view. The book is the interface; the battle HUD is thin type over the scene. */
:root {
  color-scheme: dark;
  --black: #050403; --bone: #d8cdb4; --bone-dim: #8f8570; --line: #3a3024; --blood: #9c2219; --ember: #e0a050;
  --serif: 'Cormorant Garamond', 'Palatino Linotype', Georgia, serif;
  --caps: 'Cormorant SC', 'Palatino Linotype', Georgia, serif;
  --o-bg: #14100c; --o-fg: var(--bone); --o-dim: var(--bone-dim); --o-line: var(--line);
  --o-accent: var(--blood); --o-accent-fg: #f3ead6; --o-display: 'IM Fell English SC', Georgia, serif; --o-body: var(--serif);
}
html, body { height: 100%; margin: 0; }
body { background: var(--black); color: var(--bone); font-family: var(--serif); font-size: 19px; overflow: hidden; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fade { position: fixed; inset: 0; background: var(--black); opacity: 0; pointer-events: none; z-index: 5; }
#loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--black); font: 500 1.1rem var(--caps); letter-spacing: 0.3em; color: var(--bone-dim); transition: opacity 0.8s; }
#loading.gone { opacity: 0; pointer-events: none; }

.top { position: fixed; z-index: 6; right: 20px; top: calc(14px + env(safe-area-inset-top, 0px)); display: flex; gap: 22px; font: 500 0.9rem var(--caps); letter-spacing: 0.18em; }
.top a, .top button { color: var(--bone-dim); background: none; border: 0; padding: 0; font: inherit; letter-spacing: inherit; text-decoration: none; }
.top a:hover, .top button:hover { color: var(--bone); }

#hud[hidden] { display: none; }
#hud { position: fixed; inset: 0; z-index: 4; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 56px 24px 28px; }
.bar { height: 5px; background: rgba(216, 205, 180, 0.14); border: 1px solid rgba(216, 205, 180, 0.28); }
.bar i { display: block; height: 100%; background: var(--blood); transition: width 0.5s ease-out; }
.foe { align-self: center; width: min(560px, 100%); text-align: center; text-shadow: 0 1px 8px #000; }
.foe-name { font: 600 1.5rem var(--caps); letter-spacing: 0.28em; margin-bottom: 8px; }
.foe-stats { margin-top: 6px; font-size: 0.95rem; letter-spacing: 0.06em; color: var(--bone-dim); font-variant-numeric: tabular-nums; }
.roll { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); font: 500 9rem/1 var(--serif); color: var(--bone); opacity: 0; text-shadow: 0 0 40px #000, 0 0 12px #000; transition: opacity 0.25s; font-variant-numeric: lining-nums; }
.roll.show { opacity: 0.92; }
.roll small { display: block; font: 500 0.95rem var(--caps); letter-spacing: 0.3em; text-align: center; color: var(--bone-dim); }
.dmg { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font: 500 3.2rem/1 var(--serif); color: var(--ember); opacity: 0; text-shadow: 0 0 18px #000; }
.dmg.pop { animation: dmg 1.1s ease-out; }
@keyframes dmg { 0% { opacity: 0; margin-top: 20px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -50px; } }
.bottom { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr) minmax(0, 260px); align-items: end; gap: 20px; }
.me { text-shadow: 0 1px 8px #000; }
.me-name { font: 600 1.05rem var(--caps); letter-spacing: 0.22em; margin-bottom: 6px; }
.me .bar i { background: #6f8f5f; }
.me.low .bar i { background: var(--blood); }
.me-stats { margin-top: 6px; font-size: 0.95rem; color: var(--bone-dim); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
.mid { display: flex; flex-direction: column; align-items: center; gap: 16px; min-width: 0; }
.log { min-height: 2.6em; max-width: 34em; text-align: center; font-style: italic; font-size: 1.25rem; line-height: 1.3; text-shadow: 0 1px 10px #000, 0 0 3px #000; transition: opacity 0.2s; }
.cmds { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; pointer-events: auto; min-height: 46px; }
.cmd { padding: 9px 22px; border: 1px solid rgba(216, 205, 180, 0.4); background: rgba(5, 4, 3, 0.55); color: var(--bone); font: 600 1rem var(--caps); letter-spacing: 0.2em; backdrop-filter: blur(3px); }
.cmd:hover:not(:disabled), .cmd:focus-visible { border-color: var(--bone); background: rgba(156, 34, 25, 0.5); outline: none; }
.cmd:disabled { opacity: 0.32; }
.cmd small { display: block; font: 500 0.72rem var(--serif); letter-spacing: 0.06em; color: var(--bone-dim); text-transform: none; }
@media (max-width: 760px) {
  .bottom { grid-template-columns: 1fr; }
  .me { order: 2; }
  .roll { font-size: 6rem; }
  #hud { padding: 50px 16px 18px; }
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" hidden>
  <div class="foe"><div class="foe-name"></div><div class="bar"><i></i></div><div class="foe-stats"></div></div>
  <div class="roll"></div>
  <div class="dmg"></div>
  <div class="bottom">
    <div class="me"><div class="me-name">Lone Wolf</div><div class="bar"><i></i></div><div class="me-stats"></div></div>
    <div class="mid"><div class="log" aria-live="polite"></div><div class="cmds"></div></div>
    <div></div>
  </div>
</div>
<div id="fade"></div>
<nav class="top">
  <a href="../index.html">Prototypes</a>
  <button type="button" id="btn-sound">Sound on</button>
  <button type="button" id="btn-new">New game</button>
</nav>
<div id="loading">Lighting the candles</div>

</script>
<script src="../../shared/core.js"></script>
<script src="../../shared/book-demo.js"></script>
<script src="../../shared/ui.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
