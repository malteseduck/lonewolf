# Unit tests for the Python tools (ADR 0022): tests/py/, run with
#   uv run --project tools python -m pytest
# in parallel (pytest-xdist): more than 6 workers only adds start-up time on Windows. Add -n 0 to run in one process (a debugger, -x).
[pytest]
testpaths = tests/py
addopts = -q -n auto --maxprocesses 6
